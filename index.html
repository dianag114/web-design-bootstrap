<!-- FORMULARIO -->

<div class="container d-flex justify-content-center mt-5">

<div class="card shadow p-4 formulario">

<h2 class="text-center text-primary fw-bold">Contáctanos</h2>

<p class="text-center text-muted">
Completa el formulario para enviarnos tu mensaje.
</p>

<form>

<!-- NOMBRE -->

<label class="fw-bold">Nombre Completo</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="fa-solid fa-user"></i>
</span>

<input type="text" class="form-control" placeholder="Juan Pérez">

</div>


<!-- EMAIL -->

<label class="fw-bold">Correo Electrónico</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="fa-regular fa-envelope"></i>
</span>

<input type="email" class="form-control" placeholder="juan.perez@email.com">

</div>


<!-- TELEFONO -->

<label class="fw-bold">Número de Teléfono</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="fa-solid fa-phone"></i>
</span>

<input type="text" class="form-control" placeholder="+34 612 345 678">

</div>


<!-- CIUDAD -->

<label class="fw-bold">Ciudad / Localidad</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="fa-solid fa-location-dot"></i>
</span>

<input type="text" class="form-control" placeholder="Madrid">

</div>


<!-- MENSAJE -->

<label class="fw-bold">Tu Mensaje</label>

<textarea class="form-control mb-3" rows="4" placeholder="Escribe tu consulta aquí..."></textarea>


<button class="btn btn-primary w-100">
Enviar
</button>

</form>

</div>

</div>
