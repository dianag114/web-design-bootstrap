<!-- FORMULARIO -->

<section class="form-section">

<div class="container d-flex justify-content-center">

<div class="form-card">
<h2 class="title text-center">Contáctanos</h2>
<p class="subtitle text-center">Completa el formulario para enviarnos tu mensaje.</p>

<form>

<label class="form-label">Nombre Completo</label>

<div class="input-group mb-3">
<span class="input-group-text">
<i class="fa-solid fa-user"></i>
</span>
<input type="text" class="form-control" placeholder="Juan Pérez">
</div>

<label class="form-label">Correo Electrónico</label>

<div class="input-group mb-3">
<span class="input-group-text">
<i class="fa-solid fa-envelope"></i>
</span>
<input type="email" class="form-control" placeholder="juan.perez@email.com">
</div>

<label class="form-label">Número de Teléfono</label>

<div class="input-group mb-3">
<span class="input-group-text">
<i class="fa-solid fa-phone"></i>
</span>
<input type="text" class="form-control" placeholder="+34 612 345 678">
</div>

<label class="form-label">Ciudad / Localidad</label>

<div class="input-group mb-3">
<span class="input-group-text">
<i class="fa-solid fa-location-dot"></i>
</span>
<input type="text" class="form-control" placeholder="Madrid">
</div>

<label class="form-label">Tu Mensaje</label>

<textarea class="form-control mb-4" rows="4"
placeholder="Escribe tu consulta aquí..."></textarea>

<button class="btn btn-primary w-100 btn-submit">
Enviar
</button>

</form>

</div>
</div>

</section>
