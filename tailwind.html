<!-- FORMULARIO -->

<div class="flex justify-center mt-12">

<div class="bg-white shadow-md rounded-lg p-6 w-96">

<h2 class="text-center text-2xl font-bold text-blue-700">
Contáctanos
</h2>

<p class="text-center text-gray-500 mb-4">
Completa el formulario para enviarnos tu mensaje
</p>

<form class="space-y-4">

<div class="flex items-center border rounded">

<span class="p-2 text-gray-500">
<i class="fa-solid fa-user"></i>
</span>

<input type="text" placeholder="Juan Pérez"
class="w-full p-2 outline-none">
</div>

<div class="flex items-center border rounded">

<span class="p-2 text-gray-500">
<i class="fa-solid fa-envelope"></i>
</span>

<input type="email" placeholder="juan@email.com"
class="w-full p-2 outline-none">
</div>

<div class="flex items-center border rounded">

<span class="p-2 text-gray-500">
<i class="fa-solid fa-phone"></i>
</span>

<input type="text" placeholder="+34 612 345 678"
class="w-full p-2 outline-none">
</div>

<div class="flex items-center border rounded">

<span class="p-2 text-gray-500">
<i class="fa-solid fa-location-dot"></i>
</span>

<input type="text" placeholder="Madrid"
class="w-full p-2 outline-none">
</div>

<textarea placeholder="Escribe tu consulta aquí..."
class="w-full border rounded p-2"></textarea>

<button class="w-full bg-blue-700 text-white p-2 rounded">
Enviar
</button>

</form>

</div>

</div>

<!-- FOOTER -->

<footer class="text-center mt-10 border-t p-4">

<p>Desarrollado por: González Rivera Diana Laura</p>

<p>2026</p>

</footer>

</body>
